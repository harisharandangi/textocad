[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textocad"
version = "0.1.0"
description = "Text to parametric CAD: turn a plain-English prompt into an editable CadQuery or OpenSCAD model and export STEP, STL and GLB."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "GadiDokan Pvt. Ltd." }]
keywords = ["cad", "text-to-cad", "ai-cad", "parametric-cad", "cadquery", "openscad", "llm", "step", "stl", "3mf", "3d-printing", "urdf", "robotics"]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28",
  "openai>=1.58,<2",
  "anthropic>=0.40,<1",
  "json-repair>=0.30",
  "numpy>=1.26,<3",
  "trimesh>=4.12",
  "cadquery==2.6.1",
  "manifold3d>=3.5",
  "scikit-image>=0.24",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
gears = ["cq_gears @ git+https://github.com/meadiode/cq_gears.git"]

[project.scripts]
textocad = "textocad.cli:main"

[project.urls]
Homepage = "https://textocad.com"
Repository = "https://github.com/harisharandangi/textocad"
Issues = "https://github.com/harisharandangi/textocad/issues"

[tool.setuptools.packages.find]
include = ["textocad*"]

[tool.setuptools.package-data]
textocad = ["web/*.html", "web/*.png"]
